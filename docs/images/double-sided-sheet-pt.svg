<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Folha 1 de uma pecha em frente e verso: pechas 1 e 3 na frente, 4 e 2 no verso"><title>Folha 1 de uma pecha em frente e verso: pechas 1 e 3 na frente, 4 e 2 no verso</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="640" height="300" fill="#fff"/><text x="170" y="28" text-anchor="middle" font-size="16" font-weight="700">Folha 1, frente</text><rect x="40" y="40" width="260" height="184" fill="#fff" stroke="#333" stroke-width="2"/><rect x="50" y="48" width="240" height="76" fill="none" stroke="#333" stroke-width="1.5"/><text x="170" y="96" text-anchor="middle" font-size="30" font-weight="700">1</text><rect x="50" y="140" width="240" height="76" fill="none" stroke="#333" stroke-width="1.5"/><text x="170" y="188" text-anchor="middle" font-size="30" font-weight="700">3</text><line x1="70" y1="132" x2="270" y2="132" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/><text x="470" y="28" text-anchor="middle" font-size="16" font-weight="700">Folha 1, verso</text><rect x="340" y="40" width="260" height="184" fill="#fff" stroke="#333" stroke-width="2"/><rect x="350" y="48" width="240" height="76" fill="none" stroke="#333" stroke-width="1.5"/><text x="470" y="96" text-anchor="middle" font-size="30" font-weight="700">4</text><rect x="350" y="140" width="240" height="76" fill="none" stroke="#333" stroke-width="1.5"/><text x="470" y="188" text-anchor="middle" font-size="30" font-weight="700">2</text><text x="320" y="262" text-anchor="middle" font-size="15">Virada pela borda longa: a pecha 2 fica atrás da 1, e a 4 atrás da 3.</text><text x="320" y="286" text-anchor="middle" font-size="13" fill="#555">A linha tracejada de corte sai só na frente.</text><path d="M 300 132 C 312 110, 328 110, 336 126" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/></svg>
