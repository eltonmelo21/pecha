<title>Motor da pecha</title><style>@font-face{font-family:'Noto Serif Tibetan';src:url(fonts/noto-serif-tibetan.woff2) format('woff2');font-style:normal;font-weight:100 900;font-display:block}
@font-face{font-family:'Noto Serif';src:url(fonts/noto-serif.woff2) format('woff2');font-style:normal;font-weight:100 900;font-display:block}
@font-face{font-family:'Noto Serif';src:url(fonts/noto-serif-italic.woff2) format('woff2');font-style:italic;font-weight:100 900;font-display:block}

@page{size:297mm 210mm;margin:0}
:root{--out:1px;--in:1px;--opening:7mm;--pair-gap:6mm;--bo:19pt;--lh-bo:1.85;--bo-small:16.2pt;--latin:10.5pt;--phon:10.5pt;--breath:5mm;--bo-title:24pt}
html,body{margin:0;padding:0;background:#fff}
#source{position:absolute;left:-9999px;top:0;width:248mm}
#stage{position:absolute;left:0;top:0}
.side{width:297mm;height:105mm;position:relative}
.sheet{width:297mm;height:210mm;position:relative;page-break-after:always;overflow:hidden}
.sheet:last-child{page-break-after:auto}
.sheet.rotated{transform:rotate(180deg)}
.cut-line{position:absolute;left:0;right:0;top:105mm;border-top:.06mm dashed #e2e2e2}
.sheet.back .cut-line{display:none}  /* double-sided: the cut line only on the front (odd) pages */
.slot{position:absolute;left:0;width:297mm;height:105mm}
.slot.top{top:0}.slot.bottom{top:105mm}
/* each pair of lines has an outer line (--out) and an inner line (--in), on all four sides: both thin (thin), the outer
   thick (thick-out) or the inner thick (thick-in); the frame grows outwards by the extra width, and
   the text loses the inner line's extra pixel from its padding, so the text area is the same in the three frames and
   the text breaks at the same points */
/* frame geometry in whole CSS pixels: Chromium snaps borders to device pixels when printing, so millimetre values
   gave unequal gaps (3 or 4 px) between the two lines depending on where each line fell. 34px = 9.0mm, 2px = 0.53mm,
   3px = 0.79mm, 1px = 0.26mm; the frame is 329px tall, leaving 33.85px (8.96mm) below against 34px above. */
.frame{position:absolute;left:calc(36px - var(--out) - var(--in));right:calc(36px - var(--out) - var(--in));top:calc(36px - var(--out) - var(--in));height:calc(325px + 2 * (var(--out) + var(--in)));box-sizing:border-box;border:var(--out) solid #000;padding:3px}
.inner{position:absolute;inset:3px;border:var(--in) solid #000;display:grid;grid-template-columns:34px 1fr 34px;grid-template-rows:100%}
.margin-box{border-right:var(--out) solid #000;display:flex;align-items:center;justify-content:center;writing-mode:sideways-lr;font-family:"Noto Serif Tibetan";font-size:9pt;padding:2mm 0}
.margin-box.right{border-right:0;border-left:var(--out) solid #000;font-size:14pt}  /* the pecha number, larger than the 9pt margin title */
.panel{display:flex;align-items:center;justify-content:center;padding:3mm;box-sizing:border-box}
.panel.left{margin-left:3px}   /* the gap towards the text comes from the text's own margin */
.panel.right{margin-right:3px}
.panel.left{border-left:var(--in) solid #000;border-right:var(--out) solid #000}
.panel.right{border-left:var(--out) solid #000;border-right:var(--in) solid #000}
.panel.edge.left{border-left:0;margin-left:0}    /* on the cover the panel touches the frame: no extra line */
.panel.edge.right{border-right:0;margin-right:0}
.panel img{max-width:100%;max-height:100%;object-fit:contain}
.plate{max-height:68mm;max-width:100%;object-fit:contain}
.text.plate-page{justify-content:center}
.margin-box span{transform:translateX(.33em)}  /* the Tibetan font's ascent/descent asymmetry pulls the ink off the line-box centre */
.text{padding:3mm calc(5mm + 1px - var(--in)) 3mm;overflow:hidden;height:100%;box-sizing:border-box;margin:0 3px;border-left:var(--in) solid #000;border-right:var(--in) solid #000;position:relative}
.text.opens-bo{padding-top:4.5mm}
.text.centered{align-content:center}
.text.opens-bo.loose{padding-top:6mm}   /* the same height as a full side: the body of the first line starts about 7.3 mm below the frame */
.text.loose:not(.opens-bo):not(:has(> .insert:first-child, > .section-head:not(.has-bo):first-child)){padding-top:7.5mm}   /* a short side opening with Latin text keeps more white above its first line; the translator's heading keeps its own margin */
/* a centred side opening with Tibetan leaves below the last line the white that lies above the midpoint between the
   highest ink (the vowel signs) and the body of the letters; the paddings add up to the same 7.5 mm, so the fit is
   unchanged */
.text.opens-bo.centered{padding-top:4.25mm;padding-bottom:3.25mm}
/* a Tibetan-only flow has deeper line boxes (1.85) and subjoined letters at the bottom: there the block sits 1 mm
   lower to balance by the body of the letters */
.text.opens-bo.centered:has(> .flow){padding-top:4mm;padding-bottom:3.5mm}
.text.cover{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center}
.cover .bo{font-size:var(--bo-title);line-height:1.6}
.cover .cover-block .bo{font-size:28pt;text-wrap:balance}
.cover .title-latin, .cover .subtitle{text-wrap:balance}
.cover .title-latin{font-family:"Noto Serif";font-size:14pt;margin:3mm 0 0}
.cover .subtitle{font-family:"Noto Serif";font-size:11pt;margin:1.5mm 0 0}
.cover .author{font-family:"Noto Serif";font-style:italic;font-size:10pt;margin:2mm 0 0}
.flow{font-family:"Noto Serif Tibetan";font-size:var(--bo);line-height:var(--lh-bo);text-align:justify;text-align-last:left}
.flow .cell{display:inline;margin-right:4mm}
.flow .cell.note{font-size:var(--bo-small)}
.flow .cell.joined{margin-right:0}   /* the shads of its end open the next verse, which keeps the space between them */
.flow .lead{white-space:nowrap}
.flow .lead .first{margin-right:4mm}
.pair{display:grid;grid-auto-flow:column;grid-auto-columns:max-content;column-gap:var(--pair-gap);align-items:baseline}
.bo{font-family:"Noto Serif Tibetan";font-size:var(--bo);line-height:var(--lh-bo);margin:0}
.keep{white-space:nowrap}   /* the last syllables of a Tibetan verse or paragraph, kept on one line */
.phon{font-family:"Noto Serif";font-weight:700;font-size:var(--phon);letter-spacing:.04em;margin:0;line-height:1.3;text-transform:uppercase}
.trans{font-family:"Noto Serif";font-size:var(--latin);margin:0 0 var(--breath);line-height:1.3}
.trans, .phon{white-space:pre-line}   /* the source's line breaks */
.block{margin-bottom:var(--breath)}
.bo.prose{line-height:1.85;text-align:justify;text-align-last:left;margin-bottom:1mm}
.para .trans{margin-bottom:1mm}
.para .phon{margin:0 0 1mm}
.para .trans:last-child{margin-bottom:var(--breath)}
/* the explanation that opens the text stands 7 mm from it, a space that does not close up with the breath */
.text > .opening > :last-child, .text > p.opening{margin-bottom:var(--opening)}
.trans.sanskrit{font-style:italic}
.note .bo, .bo .note{font-size:var(--bo-small)}
.note .trans, .trans .note{font-style:italic}
/* auxiliary text (colophon, note, instruction, explanatory prose): 85% of the recited body, italic in the Latin
   layers, upright in the Tibetan; --bo-small is 85% of --bo and follows a side's scale */
.aux .bo, .note .bo{font-size:var(--bo-small)}
.aux .trans, .aux .phon, .note .trans, .note .phon, .trans.rubric{font-style:italic;font-size:calc(var(--latin) * .85)}
.aux .phon, .note .phon{font-size:calc(var(--phon) * .85)}
.text > :last-child, .text > :last-child > .trans{margin-bottom:0}
/* the translator's own heading: left, upright small caps, 4.5 mm above the Tibetan it opens, which the yig mgo raises
   by another 4 mm */
.trans.insert{text-align:left;font-style:normal;font-variant:small-caps;letter-spacing:.06em;font-size:var(--latin);margin:0 0 4.5mm}
.text > .insert:first-child .trans.insert{margin-top:0}
.text > .section-head:not(.has-bo):first-child .trans{margin-top:0}   /* a Latin heading that opens a side: the same white above it as the translator's heading */
.text.loose > .insert:first-child .trans.insert, .text.loose > .section-head:not(.has-bo):first-child .trans{margin-top:3mm}   /* a side at the top: the heading keeps clear of the frame */
.text.centered > .insert:first-child .trans.insert, .text.centered > .section-head:not(.has-bo):first-child .trans{margin-top:-0.7mm}   /* a centred side: the heading's line box leaves more room above its letters than below the last line */
.section.insert + :has(.yig){padding-top:4mm}   /* the yig mgo rises above its line; padding, so it adds to the heading margin */
/* a numbered heading: Tibetan line over its English title, left like the translator's headings;
   padding below, so it does not merge with the margins around it */
.section-head{text-align:left;margin:0;padding-bottom:6.5mm}
.section-head .trans{font-variant:small-caps;letter-spacing:.04em;margin:1mm 0 0}
.section-head.has-bo .trans.insert{margin:1mm 0 0 !important}   /* the translator's heading under its Tibetan line: the block's padding gives the room below */
.section-head:not(.has-bo) .trans{margin-top:2mm}
.credits{font-family:"Noto Serif";font-style:italic;font-size:8pt;line-height:1.4;color:#222;max-width:200mm;text-align:center}
.credits p{margin:0 0 1.5mm}
.credits .entered{margin:3mm 0}
.credits .url{font-style:normal;overflow-wrap:anywhere}
/* the translator's notes (asked for with --notes end): numbered as on the page, in two columns, above the credits */
.notes{font-family:"Noto Serif";font-size:8pt;line-height:1.4;color:#222;text-align:left;width:100%;max-width:255mm}
.notes .notes-title{font-variant:small-caps;letter-spacing:.06em;text-align:center;margin:0 0 1.5mm}
.notes .note-list{column-count:2;column-gap:8mm}
.notes .note-list.one-column{column-count:1;width:calc(50% - 4mm)}   /* the last notes side, when its notes fit on the left */
.text.notes-top{justify-content:flex-start}
.notes .note-item{break-inside:avoid;margin:0 0 1mm;padding-left:4mm;text-indent:-4mm}
.notes .note-item .n{display:inline-block;min-width:4mm;text-indent:0}
.notes .url{overflow-wrap:anywhere}
sup.nr{font-size:.6em;line-height:0;vertical-align:super;font-style:normal;font-variant:normal;letter-spacing:0;margin-left:.05em}

@media print{#shell>*:not(#output){display:none!important}}

:root{--bo:20.0pt;--latin:11.0pt;--phon:11.0pt;--bo-small:17pt;--lh-bo:1.6;--out:1px;--in:1px}
.terma{font-family:"Noto Serif Tibetan";font-style:normal;font-weight:normal;font-size:1.1em;line-height:0}
.trans .terma{margin-left:.2em}  /* a little space before the mark, apart from the punctuation */
</style></head><body>
<div id="shell">
<div id="refusal" role="alert" hidden></div>
<template id="cover-html"></template><template id="credits-html"></template><template id="notes-html"></template>
<div id="source"></div><div id="stage"></div><div id="output"></div>
</div>
<script>
// ---- port of pecha.py: parse_lotsawa + build_units (Lotsawa House format) ----
const TIB = /[\u0F00-\u0FFF]/, YIG = "\u0F04\u0F05\u0F0D\u0F0D ", LONG_LINE = 16;
const BREAK_AFTER = ["གི","ཀྱི","གྱི","ཡི","གིས","ཀྱིས","གྱིས","ཡིས","ལ","ནས","ལས","དུ","ཏུ","སུ","རུ","ན","དང","ཅིང","ཞིང","ཤིང","ཏེ","སྟེ","དེ"];
const PROPER = new Set(("I Buddha Buddhas Dharma Sangha Saṅgha Guru Tibet Tibetan India Indian Maitreya Ānanda Avalokiteśvara "
 + "Śāriputra Tathāgata Tathāgatas Bhagavat Bhagavatī Māra Tuṣita Vulture Rājgṛha Indra Yama Vajra Vajrakīlaya Padmasambhava "
 + "Śākyamuni Tārā Mañjuśrī Vajrasattva Samantabhadra Amitābha Prajñāpāramitā Lord God Gods Śramaṇa Sugata Sugatas Jewels").split(" "));
const esc = s => (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const dashes = s => (s || "").replace(/\s*—\s*/g, " — ");
const syllables = bo => (bo.match(/\u0F0B/g) || []).length + 1;
const protectShad = bo => bo.replace(/ (?=[\u0F0D\u0F0E])/g, "\u00a0");
const isTitleCase = l => {
  if (/:\s*$/.test(l)) return false;
  const w = l.trim().split(/\s+/); if (!w.length || w.length > 9) return false;
  const small = new Set(["and","of","the","for","to","in","a","an","through","with","on","at","by","from","into","or"]);
  return w.every(x => !/^\p{L}/u.test(x) || /^\p{Lu}/u.test(x) || small.has(x.toLowerCase()));
};
function titleBreaks(bo){
  const parts = bo.split("\u0F0B"), out = [];
  for (let i = 0; i < parts.length - 1; i++){
    const syl = parts[i].trim().split(/\s+/).pop() || parts[i];
    const ok = syl.endsWith("འི") || BREAK_AFTER.includes(syl) || /[\u0F0D།]$/.test(syl);
    out.push(parts[i] + (ok ? "\u0F0B" : "\u0F0C"));
  }
  out.push(parts[parts.length - 1]); return out.join("");
}
function joinTranslations(parts){
  const out = [];
  parts.forEach((p, i) => {
    p = p.trim();
    if (i && out.length){
      const prev = out[out.length - 1].replace(/\uE014$/, "").trimEnd();   // a terma mark placeholder does not end the sentence
      const ended = /[.!?”’…:]$/.test(prev);
      const m = p.match(/^([A-Za-zÀ-ÿĀ-ſ]+)/);
      if (m && !ended){
        const w = m[1], rest = p.slice(m[0].length).match(/[A-Za-zÀ-ÿĀ-ſ]+/g) || [];
        const nextCap = rest[0] && /^\p{Lu}/u.test(rest[0]) && rest[0] !== "I";
        const ofCap = rest[0] === "of" && rest[1] && /^\p{Lu}/u.test(rest[1]);
        const name = PROPER.has(w) || w === w.toUpperCase() || /[āīūṛṝḷṅñṭḍṇśṣḥṃ]/i.test(w) || nextCap || ofCap;
        if (/^\p{Lu}/u.test(w) && !name) p = p[0].toLowerCase() + p.slice(1);
      }
    }
    out.push(p);
  });
  return out.join(" ");
}
function parse(text){
  let lines = text.replace(/\r/g, "").split("\n").map(l => l.replace(/\u00a0/g, " ").replace(/\s+$/, ""));
  const meta = {}, blocks = [], dropped = [];
  for (let k = 0; k < lines.length; k++){
    if (/^\s*\|/.test(lines[k])){
      meta.translator = lines[k].replace(/^[\s|]+/, "").trim();
      const tail = lines.slice(k + 1).map(x => x.trim()).filter(Boolean);
      const value = x => x.split(":").slice(1).join(":").trim();
      tail.forEach((x, j) => {
        if (/^version\s*:/i.test(x)) meta.version = value(x);
        else if (/^site\s*:/i.test(x)) meta.site = value(x);                     // where the text was taken from
        else if (/^address\s*:/i.test(x) && /^https?:\/\/\S+$/.test(value(x))) meta.url = value(x);
        else if (/^licen[cs]e\s*:/i.test(x)) meta.licence = value(x);            // only when the source states one
        else if (x.toLowerCase() === "source" && tail[j + 1]) meta.source_ref = tail[j + 1];
        else if (!(j && tail[j - 1].toLowerCase() === "source")) dropped.push(x);  // printed nowhere: say so
      });
      lines = lines.slice(0, k); break;
    }
  }
  const paras = []; let cur = [];
  lines.forEach(l => { if (l.trim()) cur.push(l.trim()); else if (cur.length){ paras.push(cur); cur = []; } });
  if (cur.length) paras.push(cur);
  for (const p of paras){
    if (TIB.test(p[0])){
      // "~" holds the place of a layer the source does not have: Tibetan, no transliteration, then the translation.
      // Such a paragraph is read like a Tibetan line followed by its translation alone, whatever its capitals.
      const kept = p[1] === "~";
      p.slice(3).forEach(x => dropped.push(x));                 // a Tibetan paragraph has at most three lines
      const bo = protectShad(escapeText(p[0]));
      const phon = kept ? "" : (p[1] || ""), trans = kept ? (p[2] || "") : (p[2] || "");
      const twoLine = kept || (p.length === 2 && /^\p{Lu}/u.test(p[1]));   // Unicode: catches "Ānanda"
      const alone = kept ? trans : phon;                         // the single Latin line of a two-line paragraph
      if (!blocks.length && !meta.title_bo && /^[\u0F04\u0F05]/.test(bo)){
        meta.title_bo = bo.replace(/^[\u0F04\u0F05]+[\u0F0D\s]*/, "").trim(); meta.title = kept ? trans : phon; continue;
      }
      if (isMantra(bo, phon)){ blocks.push({type:"mantra", bo, phon, extra:trans}); continue; }
      const colophon = isColophon(bo);
      if (twoLine && !colophon && syllables(bo) > LONG_LINE){ blocks.push({type:"prose", bo, phon:"", trans:[alone]}); continue; }
      if (colophon || twoLine){ blocks.push({type:"note", bo, trans: kept ? trans : phon}); continue; }
      const core = bo.replace(/^[\u0F04\u0F05]+[\u0F0D\s]*/, "");
      if (!phon && !trans && core.startsWith("རྒྱ་གར་སྐད་དུ")){ blocks.push({type:"incipit", bo}); continue; }
      blocks.push({type:"verse", bo, phon, trans});
    } else {
      for (const l of p){
        if (/^by /i.test(l)) meta.author = l.slice(3).trim();
        else if (isTitleCase(l)) blocks.push({type:"section", title:l});
        else blocks.push({type:"rubric", text:l});
      }
    }
  }
  if (dropped.length) meta.dropped = dropped;
  return {meta, blocks};
}

// ---- reader by layer markup (Lotsawa House pages) ----
// The page marks every paragraph with its layer; nothing here guesses from line positions.
const LAYER_CLASS = {TibetanVerse: "bo", TibetanExplanation: "bo-prose", EnglishPhonetics: "phon",
                     EnglishText: "trans", Explanation: "trans-prose",
                     // a mantra's Sanskrit transliteration sits where a translation would: it belongs to that layer
                     EnglishMantra: "trans-mantra",
                     tibetan_prayer_title_5: "bo-title", translated_prayer_title_5: "trans-title"};
// Classes inside the main text that are not a layer: Noline belongs to the site; ExplanationBold is an attribution
// ("revealed by…"), printed on the cover when it comes before the text and left out elsewhere.
const IGNORED_CLASSES = new Set(["ExplanationBold", "Noline"]);
// Classes the reader understands: layers, the Insert modifier, titles, credits, stanza gaps and the
// bibliographic reference of the Tibetan source (kept for the credits page). Anything else is refused.
const KNOWN_CLASSES = new Set([...Object.keys(LAYER_CLASS), ...IGNORED_CLASSES,
  "Insert", "HeadingTib", "Heading3", "Credit", "gap", "Source", "biblio"]);
const SITE = "https://www.lotsawahouse.org";

const REFUSAL = {
  "no-markup": () => "This page has Tibetan text, but not the Lotsawa House layer markup. "
    + "Without it, the engine cannot safely tell the Tibetan, transliteration and translation apart, "
    + "so no pecha was laid out.",
  "no-tibetan": link => "This page has no Tibetan text, so there is no pecha to lay out."
    + (link ? ` The Tibetan version is at ${link}.` : ""),
  "unknown-class": (cls, text, more) => `This page uses markup the engine does not know yet: the class "${cls}", `
    + `in the passage "${text}"` + (more ? `, and ${more} more passage${more > 1 ? "s" : ""} with unknown markup` : "")
    + ". So as not to lose text or move it to another layer, no pecha was laid out.",
};

function refuse(kind, ...args){ return {kind, message: REFUSAL[kind](...args)}; }

function tibetanVersionLink(doc){
  // The language menu links the same text in every language: /fr/<path>, /pt/<path>, /bo/<path>.
  // A /bo/ link counts only when another language links the same <path>, so a sidebar link is never offered.
  const paths = [...doc.querySelectorAll("a[href]")].map(a => a.getAttribute("href").replace(SITE, ""));
  const lang = /^\/(bo|fr|de|es|it|pt|nl|zh)(\/.+)$/;
  const byLang = paths.map(p => p.match(lang)).filter(Boolean);
  const bo = byLang.find(([, l, rest]) => l === "bo" && rest.split("/").filter(Boolean).length >= 2
                         && byLang.some(([, l2, rest2]) => l2 !== "bo" && rest2 === rest));
  return bo ? SITE + bo[0] : null;
}
const INCIPIT_START = /^[༄༅།\s]*(རྒྱ་གར་སྐད་དུ|བོད་སྐད་དུ)/;

function textOf(el, keepBreaks){
  const c = el.cloneNode(true);
  // footnote markers: left out, or, with the notes asked for, kept as an invisible marker (U+E000 number U+E001)
  // that becomes a superscript once the HTML is built
  c.querySelectorAll("sup").forEach(s => { const n = s.textContent.trim();
    if (opts.notes === "end" && /^\d{1,3}$/.test(n)) s.replaceWith("\uE000" + n + "\uE001"); else s.remove(); });
  // a line break of the source (<br>) separates two lines: a new line in the Latin layers, a space elsewhere; before,
  // the two lines were joined with no space ("dreamsYou")
  c.querySelectorAll("br").forEach(b => b.replaceWith(keepBreaks ? "\n" : " "));
  return c.textContent.replace(/\u00a0/g, " ").replace(/[^\S\n]+/g, " ").replace(/ *\n */g, "\n").replace(/\n+/g, "\n").trim();
}
const LATIN_LINES = ["EnglishText", "Explanation", "EnglishPhonetics"];   // layers whose line breaks are kept
function layerOf(el){
  for (const c of el.classList) if (LAYER_CLASS[c]) return LAYER_CLASS[c];
  return null;
}
function readCredit(meta, line){
  const t = line.replace(/^[\s|]+/, "").trim();
  if (/^version\s*:/i.test(t)) meta.version = t.split(":").slice(1).join(":").trim();
  else if (t) meta.translator = t;
}
function isMantra(bo, phon){
  const core = bo.replace(/^[༈༄༅།\s]+/, "");
  return /^(ཨོཾ|ཏདྱ་ཐཱ)/.test(core) || /^(om |teyatha|teyata|tadyatha)/i.test(phon || "")
      || (bo.match(/ཿ/g) || []).length >= 3;
}
function isColophon(bo){ return /^(ཅེས|ཞེས|འདིའང|འདི་ཡང|འདི་ནི)/.test(bo) || /།།\u00a0།།\s*$/.test(bo); }
const escapeText = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");  // Tibetan is inserted as HTML
const NOTE_MARK = /\uE000(\d{1,3})\uE001/g;
const noteMarks = h => (h || "").replace(NOTE_MARK, "<sup class=nr>$1</sup>");   // the marker, printed (no quotes: it may sit in an attribute)
const plainNotes = t => (t || "").replace(NOTE_MARK, "");                         // the marker, left out
// One note of the page's list, as HTML: its text without the arrow back, italics kept, a link by its text (on the
// site, the address itself); nothing else of the markup.
function noteHtml(li){
  const walk = n => n.nodeType === 3 ? escapeText(n.data)
    : n.nodeType !== 1 || n.classList.contains("Noline") ? ""
    : /^(EM|I)$/.test(n.nodeName) ? `<i>${[...n.childNodes].map(walk).join("")}</i>`
    : n.nodeName === "A" && /^https?:/.test(n.getAttribute("href") || "") ? `<span class="url">${[...n.childNodes].map(walk).join("")}</span>`
    : [...n.childNodes].map(walk).join("");
  return [...li.childNodes].map(walk).join("").replace(/\s+/g, " ").trim();
}
function readNotes(root){
  return [...root.querySelectorAll("ol.Footnote > li")].map(li => ({n: ((li.id || "").match(/\d+/) || [""])[0], html: noteHtml(li)}))
    .filter(x => x.html);
}

// What the page states about itself: its address and its licence. The licence is read from the page's own
// Creative Commons link and never presumed; a page without one has no licence line.
function pageFacts(doc){
  const facts = {};
  const canon = doc.querySelector('link[rel="canonical"]');
  if (canon && /^https:\/\/(www\.)?lotsawahouse\.org\//.test(canon.getAttribute("href") || "")) facts.url = canon.getAttribute("href");
  for (const a of doc.querySelectorAll('a[rel~="license"]')){
    const m = (a.getAttribute("href") || "").match(/^https?:\/\/creativecommons\.org\/licenses\/([a-z-]+)\/([\d.]+)\/?$/);
    if (m){ facts.licence = `CC ${m[1].toUpperCase()} ${m[2]}`; break; }
  }
  return facts;
}
function parseMarkup(pageHtml){
  const doc = new DOMParser().parseFromString(pageHtml, "text/html");
  const root = doc.getElementById("maintext") || doc.body;
  const notes = readNotes(root);         // the translator's notes, read before the list leaves the page
  root.querySelectorAll(".footnotes, ol.Footnote").forEach(n => n.remove());
  const meta = {notes}, blocks = [], unknown = [];
  if (!root.querySelector("p.TibetanVerse, p.TibetanExplanation")){
    const text = root.cloneNode(true); text.querySelectorAll("a, nav, header, footer").forEach(n => n.remove());
    const refusal = TIB.test(text.textContent) ? refuse("no-markup") : refuse("no-tibetan", tibetanVersionLink(doc));
    return {meta, blocks, unknown, refusal};
  }
  Object.assign(meta, {site: "Lotsawa House"}, pageFacts(doc));
  let cur = null;                       // the unit that phonetics and translation attach to
  let incipit = null;
  let stanza = 0, started = false;      // stanza number (it changes at every gap and heading); text begun
  const close = () => { if (cur && cur.block) blocks.push(cur.block); cur = null; };
  for (const p of root.querySelectorAll("p")){
    const t = textOf(p, LATIN_LINES.some(c => p.classList.contains(c)));
    const strange = [...p.classList].filter(c => !KNOWN_CLASSES.has(c));
    if (!p.classList.length && t) strange.push("(sem classe)");     // text with no layer at all is not ignored either
    if (strange.length){ unknown.push({classes: strange, text: t.slice(0, 80)}); continue; }
    if (p.classList.contains("gap")){ close(); stanza++; if (blocks.length) blocks.push({type: "break"}); continue; }  // stanza boundary
    if (p.classList.contains("HeadingTib")){ meta.title_bo = t.replace(/^[༄༅]+[།\s]*/, "").trim(); continue; }
    if (p.classList.contains("Heading3")){
      // every heading ends the stanza, printed or not; the first ones, before the text, are the cover's title and
      // subtitle; one marked Insert is the translator's own heading (printed by option); any other is a section
      close(); stanza++;
      if (!t){ if (blocks.length) blocks.push({type: "break"}); continue; }      // an empty heading still ends the stanza
      // a Tibetan line alone right before a heading is the same heading in Tibetan
      const before = blocks[blocks.length - 1];
      const headBo = before && before.type === "prose" && !before.phon && !before.trans.length ? before.bo : "";
      // a translator's heading before the text, when the page gave no title, is the title of the whole text (the
      // original has none): it goes to the cover, not to the flow; a second one is a section heading as usual
      if (p.classList.contains("Insert") && !started && !meta.title){ meta.title = t; meta.title_from = "insert"; continue; }
      if (p.classList.contains("Insert")){ if (headBo) blocks.pop(); blocks.push({type: "insert", text: t, bo: headBo}); continue; }
      if (!started){ if (!meta.title){ meta.title = t; meta.title_from = "heading"; } else meta.subtitle = meta.subtitle ? meta.subtitle + " " + t : t; continue; }
      // a Tibetan line alone right before (TibetanExplanation, no transliteration or translation) is the same heading
      // in Tibetan, as in the numbered headings of a sādhana: one bilingual heading
      if (headBo) blocks.pop();
      blocks.push({type: "section", title: t, bo: headBo, soft: true});                 // printed, without opening a new side
      continue;
    }
    if (p.classList.contains("ExplanationBold")){   // an attribution before the text goes to the cover; later ones stay out
      if (!started && t) meta.attribution = meta.attribution ? meta.attribution + " " + t : t;
      continue;
    }
    if (p.classList.contains("Credit")){ readCredit(meta, t); continue; }
    if (p.classList.contains("Source") || p.classList.contains("biblio")){ if (t) (meta.sources = meta.sources || []).push(t); continue; }
    const layer = layerOf(p);
    if (!layer) continue;                 // a known class outside the layers (an ignored site label)
    if (!t) continue;
    started = true;
    if (layer === "bo"){
      close();
      const bo = protectShad(escapeText(t));
      if (!blocks.some(b => !["incipit", "insert", "break"].includes(b.type)) && INCIPIT_START.test(t)){
        if (!incipit){ incipit = {type: "incipit", bo: "", lines: [], extra: []}; blocks.push(incipit); }
        const line = {bo, phon: "", trans: ""};
        incipit.lines.push(line); incipit.bo = incipit.lines.map(l => l.bo).join(" ");
        cur = {block: null, line}; continue;
      }
      cur = {block: {type: "verse", bo, phon: "", trans: "", stanza}};
      continue;
    }
    if (layer === "bo-title"){ close(); cur = {block: {type: "title", bo: protectShad(escapeText(t)), trans: ""}}; continue; }
    if (layer === "trans-title"){
      if (cur && cur.block && cur.block.type === "title" && !cur.block.trans) cur.block.trans = t;
      else { close(); blocks.push({type: "title", bo: "", trans: t}); }
      continue;
    }
    if (layer === "trans-mantra"){
      if (cur && cur.block && cur.block.type === "verse"){ cur.block.mantra = true; cur.block.trans = cur.block.trans ? cur.block.trans + " " + t : t; }
      else { close(); blocks.push({type: "mantra", bo: "", phon: "", extra: t}); }
      continue;
    }
    if (layer === "bo-prose"){ close(); cur = {block: {type: "prose", bo: protectShad(escapeText(t)), phon: "", trans: []}}; continue; }
    if (layer === "phon"){
      const unit = cur && (cur.line || cur.block);
      if (unit) unit.phon = unit.phon ? unit.phon + " " + t : t;
      else blocks.push({type: "rubric", text: t, layer: "phon"});     // transliteration with no Tibetan before it
      continue;
    }
    // translation layers
    if (cur && cur.line){
      if (!cur.line.trans) cur.line.trans = t; else incipit.extra.push(t);
      continue;
    }
    if (cur && cur.block.type === "verse" && !cur.block.trans && layer === "trans"){ cur.block.trans = t; continue; }
    if (cur && cur.block.type === "prose"){ cur.block.trans.push(t); continue; }
    close(); blocks.push({type: "rubric", text: t});
  }
  close();
  for (const b of blocks){
    if (b.type !== "verse") continue;
    if (b.mantra || isMantra(b.bo, b.phon)){ b.type = "mantra"; b.extra = b.trans; }
    else if (isColophon(b.bo)){ b.type = "note"; }
  }
  const refusal = unknown.length ? refuse("unknown-class", unknown[0].classes[0], unknown[0].text, unknown.length - 1) : null;
  return {meta, blocks, unknown, refusal};
}
function isProseDoc(blocks){
  const lens = blocks.filter(b => b.type === "verse").map(b => syllables(b.bo)).sort((a,b) => a-b);
  return lens.length > 0 && lens[Math.floor(lens.length/2)] > 11;
}

    // A verse closes with "། །": the first shad ends it, the second opens the next. Both go, in the same order, to the

      let out = `<div class="pair">${pair.map(cell).join("")}</div>`;

      let s = "";
      if (L.bo) s += `<p class="bo">${b.bo}</p>`;
      if (L.phon && b.phon) s += `<p class="phon">${esc(b.phon)}</p>`;

      if (L.trans && b.trans) s += `<p class="trans" style="text-align:center;font-variant:small-caps">${esc(dashes(b.trans))}</p>`;

      if (h) units.push(`<div class="section section-head${b.soft ? " soft" : ""}${b.bo && L.bo ? " has-bo" : ""}">${h}</div>`);
    } else if (b.type === "rubric" && b.layer === "phon"){

  if (L.trans && meta.subtitle) h += `<p class="subtitle">${esc(meta.subtitle)}</p>`;
  if (L.trans && meta.attribution) h += `<p class="author">${esc(meta.attribution)}</p>`;   // "revealed by…" (ExplanationBold)
  if (L.trans && meta.author) h += `<p class="author">${esc(meta.author)}</p>`;

// The credits page states what the page itself says (translator, version, address, licence, Tibetan source)
// and when the pecha was prepared. Nothing is presumed: a fact the page does not give is left out.
const CREDIT_WORDS = {
  en: {notes: "Notes", source: "Source", version: "Version", licence: "Licence", bibliography: "Bibliography",
       ai: "with the help of AI", made: v => ` (pecha.skill, version ${v})`, review: "It must be reviewed before use for study and practice.",
       prepared: (d, t) => `Prepared on ${d}, ${t}`, dedication: "May all beings benefit!",
       months: "January February March April May June July August September October November December".split(" "),
       date: (d, m, y) => `${d} ${m} ${y}`},
  pt: {notes: "Notas", source: "Fonte", version: "Versão", licence: "Licença", bibliography: "Bibliografia",
       ai: "com apoio de IA", made: v => ` (pecha.skill, versão ${v})`, review: "Deve ser revisado antes do uso para estudo e prática.",
       prepared: (d, t) => `Preparado em ${d}, às ${t}`, dedication: "Que todos os seres se beneficiem!",
       months: "janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro".split(" "),
       date: (d, m, y) => `${d} de ${m} de ${y}`},

function writtenDate(ymd, lang){
  const W = CREDIT_WORDS[lang] || CREDIT_WORDS.en, [y, m, d] = ymd.split("-").map(Number);
  return W.date(d, W.months[m - 1], y);
}
const ABBREV_MAX = 24;                 // characters that fit along the margin box
// At most `max` characters, cut after a tsheg, shad, terma mark or space, never inside a syllable.
function atSyllable(t, max){
  if (t.length <= max) return t;
  const head = t.slice(0, max), cut = head.match(/^[\s\S]*[\u0F0B\u0F0D\u0F0E\u0F14\s]/);

      paging.renumbered = (paging.renumbered || 0) + 1;
      const m = sd.querySelector('.margin-box.right span'); if(m && m.textContent) m.textContent = tibetanDigits(k + 1); });
  }
  if(I['penultimate']){ number++; const plate = makeSide(number, true); sides.push(plate); const t = plate.querySelector('.text'); t.classList.add('plate-page'); t.innerHTML = plateHtml(I['penultimate']); }
  // credits page: source, the date with the dedication, and the notice, always on its own side. The translator's
  // notes, when asked for, go above the credits; when they do not fit there, they open their own sides before the
  // credits, note by note, and a note is never cut between two sides
  const notesH = document.getElementById('notes-html').innerHTML, creditsH = document.getElementById('credits-html').innerHTML;
  let credits = makeSide(number + 1, true);
  credits.querySelector('.text').innerHTML = notesH + creditsH;
  if(notesH && !fitsSide(credits.querySelector('.text'))){
    credits.remove();
    const tmp = document.createElement('div'); tmp.innerHTML = notesH;
    const head = tmp.querySelector('.notes-title'), items = [...tmp.querySelectorAll('.note-item')];
    let list = null, first = true;
    const open = () => { number++; const sd = makeSide(number, true); sides.push(sd);
      sd.querySelector('.text').innerHTML = `<div class="notes">${first && head ? head.outerHTML : ''}<div class="note-list"></div></div>`;
      first = false; list = sd.querySelector('.note-list'); return sd; };
    let sd = open();
    for(const it of items){
      list.appendChild(it);
      if(!fitsSide(sd.querySelector('.text')) && list.children.length > 1){ it.remove(); sd = open(); list.appendChild(it); }
    }
    // the last notes side, after the first: when its notes fit in the left column, they stay there, starting at the
    // height of the first note of the side before, as if the title were still above them (author's choice, 16/10/2026)
    if(head && sides.filter(x => x.querySelector('.text > .notes')).length > 1){
      const t = sd.querySelector('.text'), prev = sides[sides.length - 2].querySelector('.text');
      const prevItem = prev.querySelector('.note-item'), pad = parseFloat(getComputedStyle(t).paddingTop) || 0;
      const top = prevItem ? prevItem.getBoundingClientRect().top - prev.getBoundingClientRect().top - pad : 0;
      list.classList.add('one-column'); t.classList.add('notes-top'); list.style.marginTop = Math.max(0, top) + 'px';
      if(!fitsSide(t)){ list.classList.remove('one-column'); t.classList.remove('notes-top'); list.style.marginTop = ''; }
    }
    credits = makeSide(number + 1, true);
    credits.querySelector('.text').innerHTML = creditsH;
  }
  sides.push(credits);
  // a long bibliography must not be cut off: the credits widen, then shrink in steps down to a legible floor
  const ct = credits.querySelector('.text'), box = ct.querySelector('.credits');
  if(box && !fitsSide(ct)) box.style.maxWidth = 'none';      // first the full width of the side, then smaller type
  for(let pt = 8; box && !fitsSide(ct) && pt > CREDITS_MIN_PT; ){ pt -= 0.25; box.style.fontSize = pt + 'pt'; }
  return sides;
}

function newSheet(face){ const s = document.createElement('div'); s.className = 'sheet ' + face; s.innerHTML = '<div class="slot top"></div><div class="cut-line"></div><div class="slot bottom"></div>'; document.getElementById('output').appendChild(s); return s; }
function place(sheet, slot, side){ if(!side) return; sheet.querySelector('.slot.' + slot).appendChild(side); side.style.position = 'absolute'; side.style.top = 0; side.style.left = 0; }
function impose(sides){
  const S = n => sides[n - 1]; const n = sides.length;
  if(CFG.doubleSided){
    for(let k = 0; 4 * k < n; k++){
      const front = newSheet('front'); place(front, 'top', S(4*k+1)); place(front, 'bottom', S(4*k+3));
      const back = newSheet('back' + (CFG.flip === 'short' ? ' rotated' : '')); place(back, 'top', S(4*k+4)); place(back, 'bottom', S(4*k+2));
    }
  } else {
    for(let k = 0; 2 * k < n; k++){ const front = newSheet('front'); place(front, 'top', S(2*k+1)); place(front, 'bottom', S(2*k+2)); }
  }
}
const AUX = 0.85;                        // auxiliary text: share of the recited body
// the translation's size, from the stylesheet (the auto-fit never changes it)
function latinPt(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--latin')); }
// the transliteration follows the Tibetan when the whole text is set down, but never below the translation: it is the
// line that is recited aloud, and at 6.9 pt (Confession of Downfalls) it was hard to read
function phonPt(f){ return Math.max(CFG.phonSize * f, Math.min(CFG.phonSize, latinPt())); }
function applyFactor(f){
  const r = document.documentElement.style;
  r.setProperty('--bo', (CFG.boSize * f).toFixed(1) + 'pt'); r.setProperty('--phon', phonPt(f).toFixed(1) + 'pt'); r.setProperty('--bo-small', (CFG.boSize * f * AUX).toFixed(2) + 'pt');
}
const MIN_BO_PT = 12;     // smallest Tibetan size the auto-fit may choose; below it text is cut, not shrunk
function proseFactor(f){
  // reduce the Tibetan size until the tallest paragraph, with its translation, fits on one side
  const source = document.getElementById('source'); const paras = [...source.querySelectorAll('.para:not(.aux)')].filter(p => p.querySelector('.bo')); if(!paras.length) return f;  // Latin-only blocks never shrink the Tibetan, nor does auxiliary prose (it is cut across sides instead)
  for(let it = 0; it < 8; it++){
    applyFactor(f);
    const probe = makeSide(99); const t = probe.querySelector('.text'); t.classList.add('opens-bo');
    const cs = getComputedStyle(t); const avail = t.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 0.5;
    let worst = null, worstH = 0;
    for(const p of paras){ const c = p.cloneNode(true); t.appendChild(c); const h = c.getBoundingClientRect().height; if(h > worstH){ worstH = h; worst = c; } }
    let boH = 0; if(worst){ worst.querySelectorAll('.bo').forEach(b => boH += b.getBoundingClientRect().height); }
    probe.remove();
    if(worstH <= avail || CFG.boSize * f <= MIN_BO_PT) break;
    const needed = avail - (worstH - boH);          // height left for the Tibetan block
    // never below the recitation floor: a paragraph still too tall is cut across sides instead
    f = Math.max(MIN_BO_PT / CFG.boSize, f * Math.max(0.6, Math.min(0.97, needed / boH)) * 0.99);
  }
  return f;
}
// every font face is loaded before the layout: a Tibetan-only body never asks for the Latin ones, and the notes and
// the credits, measured with a fallback face, would not fit once printed with their own
const FONTS_FIRST = ['12px "Noto Serif Tibetan"', '12px "Noto Serif"', 'italic 12px "Noto Serif"'];
Promise.all(FONTS_FIRST.map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  const sourceEl = document.getElementById('source'); const html0 = sourceEl.innerHTML; const stage = document.getElementById('stage');
  if (CFG.refused){                       // the reader refused the input: lay nothing out, report why
    stage.remove(); sourceEl.remove();
    window.__report = {refusal: window.__refusal, run: window.__run || null, sides: []};
    document.body.dataset.ready = '1';
    return;
  }
  // pairs never shrink the text: one wider than the side is split into two rows during pagination
  let f = 1, sides = null, attempts = 0;
  if(CFG.autoSize) f = proseFactor(f);
  while(!sides){
    attempts++; applyFactor(f); sourceEl.innerHTML = html0; stage.innerHTML = '';
    splitPairs = 0; splitParas = 0; shadMoves = new Set(); rebalanced = 0; paging = {}; flowTails = 0; flowSplits = 0;
    sides = paginate();
  }
  const mm = v => +(v / 96 * 25.4).toFixed(1);
  const report = sides.map(s => { const t = s.querySelector('.text'), [used, area] = filled(t);
    const kind = t.classList.contains('plate-page') ? 'plate' : t.querySelector(':scope > .credits') ? 'credits'
               : t.querySelector(':scope > .notes') ? 'notes' : t.classList.contains('cover') ? 'cover' : 'text';
    return {number: +s.dataset.number, kind, ended: s.dataset.ended || null, top_mm: mm(parseFloat(getComputedStyle(t).paddingTop)),
            scale: t.dataset.scale ? +t.dataset.scale : 1, content_mm: mm(used), area_mm: mm(area),
            fill: area > 0 ? +(used / area).toFixed(3) : 0, fits: fitsSide(t), breath_mm: t.dataset.breath ? +t.dataset.breath : 5, margin: (s.querySelector('.margin-box.right span') || {}).textContent || '', units: t.children.length, cells: t.querySelectorAll('.cell').length, bo_lines: flowLines(t), bo_chars: [...t.querySelectorAll(':scope > .flow')].reduce((n, f) => n + f.textContent.length, 0),
            opening_mm: (o => o && o.nextElementSibling ? mm(o.nextElementSibling.getBoundingClientRect().top - o.getBoundingClientRect().bottom) : null)(t.querySelector(':scope > .opening')),
            opening_text: (o => o ? o.textContent.trim().slice(0, 40) : null)(t.querySelector(':scope > .opening'))}; });
  // a nearly full side is centred in its height; a side the text leaves short keeps the text at the top.
  // Decided after the report above, so `fill` stays measured with the text at the top; `top_mm` and `align` are
  // then read again from the side as printed.
  sides.forEach((s, k) => { const t = s.querySelector('.text'), r = report[k];
    if(r.kind !== 'text') return;
    // a Tibetan-only flow side closed because the next line did not fit is full, whatever its fill
    const full = r.fill >= (t.classList.contains('opens-bo') ? FULL_SIDE_BO : FULL_SIDE) || (r.ended === 'full' && !!t.querySelector(':scope > .flow'));
    const centred = full && !t.dataset.split;          // the two sides that share the last lines of a flow keep the text at the top
    t.classList.add(centred ? 'centered' : 'loose');
    r.align = centred ? 'centered' : 'top';
    r.opens_bo = t.classList.contains('opens-bo');
    r.top_mm = mm(parseFloat(getComputedStyle(t).paddingTop)); });
  impose(sides);
  stage.remove(); sourceEl.remove();
  window.__report = {size: {bo: +(CFG.boSize * f).toFixed(1), phon: +phonPt(f).toFixed(1), factor: +f.toFixed(3), attempts, split_pairs: splitPairs, split_paras: splitParas, rebalanced_sides: rebalanced, rebalance: paging, flow_tails: flowTails, flow_splits: flowSplits, shad_moves: shadMoves.size, openings: sides.reduce((n, sd) => n + sd.querySelectorAll('.text > .opening').length, 0)},
    ...(window.__creditsLang || {}), run: window.__run || null, pairing: (typeof pairing === 'undefined') ? null : pairing, terma: (typeof terma === 'undefined') ? null : terma, sides: report, fonts: [...new Set([...document.fonts].filter(x => x.status === 'loaded').map(x => x.family))], sheets: document.querySelectorAll('.sheet').length};
  // wait for every image (panels and plates are inserted after the load event) and for every font face,
  // including the Latin ones that a Tibetan-only body never requests before the credits page is inserted
  const fontsNeeded = [document.fonts.load('12px "Noto Serif Tibetan"'), document.fonts.load('12px "Noto Serif"'), document.fonts.load('italic 12px "Noto Serif"')];
  Promise.all([...fontsNeeded, ...[...document.images].map(i => i.complete ? Promise.resolve() : new Promise(r => { i.onload = r; i.onerror = r; }))])
    .then(() => document.fonts.ready).then(() => {
      window.__report.fonts = [...new Set([...document.fonts].filter(x => x.status === 'loaded').map(x => x.family))];
      document.body.dataset.ready = '1';
    });
});
</script>

<script>Object.assign(CFG, window.__set);</script>
